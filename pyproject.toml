[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-recording-skill"
version = "0.1.0"
description = "Agent skill + CLI: list, inspect and download your own Zoom cloud recordings through a visible Chrome window you signed in to, read-only, with resumable verified downloads and a per-meeting manifest."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zoom-rec = "zoom_recording.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
